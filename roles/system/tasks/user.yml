---
- name: Ensure group sudo exists
  ansible.builtin.group:
    name: sudo
    state: present

- name: Debug print of some vars
  ansible.builtin.debug:
    msg: "var 'enable_passwordless_sudo' exists: {{ enable_passwordless_sudo | default(false) }}"

- name: Allow sudo group to have passwordless sudo
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: "^%sudo"
    line: "%sudo ALL=(ALL) NOPASSWD: ALL"
    validate: "/usr/sbin/visudo -cf %s"
  when: enable_passwordless_sudo | default(false) | bool

- name: Create a login user
  ansible.builtin.user:
    name: "{{ username }}"
    password: "{{ user_password | string | password_hash('sha512') }}"
    groups:
      - sudo
      - users
    state: present
    append: true
    shell: "{{ user_shell }}"
  when: enable_username_creation | default(false) | bool

- name: Ensure group for username exists
  ansible.builtin.group:
    name: "{{ username }}"
    state: present
  when: enable_username_creation | default(false) | bool

- name: Chmod the user home directory
  ansible.builtin.file:
    path: "/home/{{ username }}"
    state: directory
    mode: "0755"
    owner: "{{ username }}"
    group: "{{ username }}"
    recurse: true
  when: enable_username_creation | default(false) | bool
