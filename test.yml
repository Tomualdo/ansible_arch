---
- name: Local sanity check
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    username: "testuser"
  tasks:
    - name: Get current date
      ansible.builtin.command: date
      register: current_date
      changed_when: false

    - name: Print date and username
      ansible.builtin.debug:
        msg: "User: {{ username }}, Date: {{ current_date.stdout }}"
